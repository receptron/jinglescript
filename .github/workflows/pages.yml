name: Playground (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Building only reads the repository; deploying needs the Pages and OIDC token permissions, given
# to that job alone.
permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a deployment under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            gui-plugin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn install --frozen-lockfile
        working-directory: gui-plugin
      # Writes out/playground: the page, the library's browser entry from source, the examples and samples/sfx/.
      - run: yarn playground:build
        working-directory: gui-plugin
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/playground

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
