name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads: checkout, install, format, lint, typecheck, build and test. Nothing writes
# to the repository, so the default token needs nothing else.
permissions:
  contents: read

# A pull request supersedes its own earlier pushes; a push to main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Platform-independent: prettier, eslint, tsc and the build answer the same on every runner.
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Prettier first: a formatting slip is the cheapest failure to read.
      - name: Format
        run: yarn format:check
      - name: Lint
        run: yarn lint
      # Covers src, tests, scripts, examples and eval. Needed on its own because vitest strips
      # types rather than checking them.
      - name: Typecheck
        run: yarn typecheck
      - name: Build
        run: yarn build

  # Rendering must be bit-identical on every machine (golden PCM hashes), so the tests run on
  # both platforms the CLI is used on and on the Node versions we support. No ffmpeg: tests that
  # need it skip themselves.
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
          # The oldest Node the package supports (package.json engines).
          - os: ubuntu-latest
            node: 22.12.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test

  # Verifies the published package actually works: scripts/smoke.sh packs the exact tarball
  # (prepack builds dist/), installs it into an empty folder and renders through the CLI (WAV and
  # MP3), the library and the MCP server over stdio. Run the same script locally before changing
  # packaging, the CLI or the MCP server.
  # Packing runs the build scripts, which need Node's TypeScript support (22.18+); the packed
  # tarball is then installed and run on each Node the package supports, the oldest included.
  package-smoke:
    name: Package smoke (pack, install, render on node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: yarn install --frozen-lockfile
      # npm packs (and publishes): it reads no lockfile, and the tarball is what `npm install` gets.
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install and render
        run: SMOKE_TARBALL="$(ls "$RUNNER_TEMP"/jinglescript-*.tgz)" scripts/smoke.sh

  # The GUI Chat Protocol plugin (gui-plugin/): its own package, typechecked against the library's
  # source, tested, and built.
  gui-plugin:
    name: GUI plugin (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gui-plugin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            gui-plugin/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: .
      # The plugin's declarations import the library's types from its dist/.
      - run: yarn build
        working-directory: .
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
